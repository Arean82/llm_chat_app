<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="app_title">{% block title %}Synora Studio SaaS - Multi-Tenant Cloud AI Console{% endblock %}</title>
    <meta name="description"
        content="Experience high-performance, low-latency inference with the self-hosted Quantum Multi-Tenant SaaS Cloud Workstation.">

    <!-- App Branding Icon -->
    <link rel="icon" type="image/x-icon" href="/app_icon.ico">

    <!-- Local Typography Stack -->
    <link rel="stylesheet" href="/static/css/fonts.css?v=800">
    <!-- Dynamic Aesthetic Stylesheet -->
    <link rel="stylesheet" href="/static/css/styles.css?v=800">
    <link rel="stylesheet" href="/static/css/theme-light.css?v=800" id="theme-stylesheet">
    <link rel="stylesheet" href="/static/css/settings_hub.css?v=800">
    <link rel="stylesheet" href="/static/css/model_popup.css?v=800">

    <!-- FontAwesome Local -->
    <link rel="stylesheet" href="/static/fontawesome/css/all.min.css">
    {% block extra_head %}{% endblock %}
</head>

<body class="theme-light">

    <!-- Dynamic Animated Background Sphere Glows -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-glow bg-glow-3"></div>

    <!-- APPLICATION SHELL -->
    <div id="app-shell">
        {% block content %}{% endblock %}
    </div>

    <script>
        // Local settings password visibility utility
        function toggleSettingKeyVisibility() {
            const field = document.getElementById('set-api-key');
            const icon = document.getElementById('toggle-setting-eye');
            if (field.type === 'password') {
                field.type = 'text';
                icon.classList.replace('fa-regular', 'fa-solid');
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                field.type = 'password';
                icon.classList.replace('fa-solid', 'fa-regular');
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>

    <script type="module" src="/static/js/api.js?v=800"></script>
    <script type="module" src="/static/js/workspace.js?v=800"></script>
    <script type="module" src="/static/js/settings_hub.js?v=800"></script>
    <script type="module" src="/static/js/model_popup.js?v=800"></script>
    <script type="module" src="/static/js/settings_main.js?v=800"></script>
    <script type="module" src="/static/js/system_health.js?v=800"></script>
    <script type="module">
        import { initMainApp } from '/static/js/main.js?v=800';
        import { initThemeToggle, toggleTheme } from '/static/js/theme-toggle.js?v=800';
        import { initI18n } from '/static/js/i18n.js?v=800';

        // Expose toggle to global scope for inline buttons if needed, or attach events
        window.toggleTheme = toggleTheme;

        // We defer i18n loading to ensure strings are ready. main.js handles its own initialization.
        document.addEventListener('DOMContentLoaded', async () => {
            initThemeToggle();

            // Attach theme toggle click events
            document.querySelectorAll('.btn-theme-toggle').forEach(btn => {
                btn.addEventListener('click', toggleTheme);
            });

            await initI18n('en');
        });
    </script>

    {% block extra_scripts %}{% endblock %}
</body>

</html>
