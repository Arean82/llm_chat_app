<!-- PURE STANDALONE MODEL SELECTION MODAL (1:1 Desktop Clone) -->
<div id="pure-model-selection-modal"
    style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 10000; align-items: center; justify-content: center; backdrop-filter: blur(5px);">
    <div
        style="background: var(--bg-dark); border: 1px solid var(--border-glow); border-radius: var(--radius-md); width: 95%; max-width: 900px; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,0.7);">

        <div
            style="padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-glow); display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0; font-size: 1.2rem; display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-list"></i> Select Active Model
            </h3>
        </div>

        <div
            style="padding: 1rem 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2);">
            <label
                style="display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-dim); font-size: 0.9rem;">
                <input type="checkbox" id="pure-model-show-all"
                    onchange="if(window.renderDesktopCloneTable) window.renderDesktopCloneTable()"> Show models from
                all providers
            </label>

            <select id="pure-model-capability-filter"
                onchange="if(window.renderDesktopCloneTable) window.renderDesktopCloneTable()"
                style="background: var(--bg-card); color: var(--text-bright); border: 1px solid var(--border-glow); border-radius: 4px; padding: 4px 8px; font-size: 0.85rem; outline: none;">
                <option value="0">All Capabilities</option>
                <option value="1">General Chat</option>
                <option value="2">Supports Tools</option>
                <option value="3">Multimodal / Vision</option>
            </select>
        </div>

        <div style="flex: 1; overflow-y: auto; padding: 0;">
            <table id="pure-model-table"
                style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem;">
                <thead style="background: rgba(0,0,0,0.4); position: sticky; top: 0; z-index: 10;">
                    <tr>
                        <th
                            style="padding: 10px; border-bottom: 1px solid var(--border-glow); width: 60px; text-align: center;">
                            Active</th>
                        <th style="padding: 10px; border-bottom: 1px solid var(--border-glow); width: 120px;">
                            Ecosystem</th>
                        <th style="padding: 10px; border-bottom: 1px solid var(--border-glow); width: 120px;">
                            Developer</th>
                        <th style="padding: 10px; border-bottom: 1px solid var(--border-glow); width: 200px;">Model
                            Name</th>
                        <th style="padding: 10px; border-bottom: 1px solid var(--border-glow);">Description</th>
                    </tr>
                </thead>
                <tbody id="pure-model-table-body">
                    <!-- Rows dynamically populated by model_popup.js -->
                </tbody>
            </table>
        </div>

        <div
            style="padding: 1rem 1.5rem; border-top: 1px solid var(--border-glow); display: flex; justify-content: flex-end; gap: 10px; background: rgba(0,0,0,0.2);">
            <button onclick="document.getElementById('pure-model-selection-modal').style.display='none'"
                class="btn-new"
                style="background: transparent; border: 1px solid var(--text-dim); color: var(--text-dim);">Cancel</button>
            <button id="pure-model-apply-btn" onclick="if(window.applyModelSelection) window.applyModelSelection()"
                class="btn-new" style="background: var(--accent-cyan); color: #000; font-weight: 600;"
                disabled>Apply</button>
        </div>

    </div>
</div>
