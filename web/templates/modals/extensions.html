<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
    /* Premium Glassmorphic Badge Styles */
    .platform-badge {
        font-size: 0.75rem;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 12px;
        display: inline-block;
    }
    .platform-vscode {
        background: rgba(37, 99, 235, 0.15);
        color: #60a5fa;
        border: 1px solid rgba(37, 99, 235, 0.3);
    }
    .platform-jetbrains {
        background: rgba(168, 85, 247, 0.15);
        color: #c084fc;
        border: 1px solid rgba(168, 85, 247, 0.3);
    }
    
    .ext-row-item {
        transition: all 0.2s ease;
    }
    .ext-row-item:hover {
        background: rgba(255, 255, 255, 0.05);
    }
    
    /* Markdown Styles for Right Panel in Dark Mode */
    #ext-markdown-output h1, #ext-markdown-output h2, #ext-markdown-output h3 { color: var(--text-bright); border-bottom: 1px solid var(--border-glow); padding-bottom: 6px; margin-top: 15px; margin-bottom: 10px; font-weight: 700; }
    #ext-markdown-output h1 { font-size: 1.4rem; }
    #ext-markdown-output h2 { font-size: 1.2rem; }
    #ext-markdown-output h3 { font-size: 1.1rem; }
    #ext-markdown-output p { margin-bottom: 12px; font-size: 0.95rem; color: var(--text-dim); line-height: 1.6; }
    #ext-markdown-output pre { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 6px; overflow-x: auto; border: 1px solid var(--border-glow); margin: 12px 0; }
    #ext-markdown-output code { background: rgba(255,255,255,0.08); padding: 2px 5px; border-radius: 4px; font-family: monospace; color: #f472b6; font-size: 0.85rem; }
    #ext-markdown-output pre code { background: none; padding: 0; color: var(--text-bright); font-size: 0.9rem; }
    #ext-markdown-output ul, #ext-markdown-output ol { padding-left: 20px; margin-bottom: 12px; color: var(--text-dim); }
    #ext-markdown-output li { margin-bottom: 4px; }
</style>

<script>
    let activeExtensions = [];
    let selectedExtension = null;

    window.loadExtensionsHub = async function() {
        const container = document.getElementById('extensions-list-container');
        container.innerHTML = '<div style="color: var(--text-dim); font-size: 0.9rem;"><i class="fa-solid fa-circle-notch fa-spin"></i> Crawling directories...</div>';
        
        try {
            const token = sessionStorage.getItem('quantum_token') || (typeof App !== 'undefined' ? App.token : '');
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;

            const res = await fetch('/api/extensions', { headers });
            const data = await res.json();
            
            if (data.success) {
                activeExtensions = data.extensions;
                renderExtensionsList();
            } else {
                container.innerHTML = `<div style="color: #f87171; font-size: 0.9rem;">Error: ${data.error}</div>`;
            }
        } catch (e) {
            container.innerHTML = `<div style="color: #f87171; font-size: 0.9rem;">Failed to connect: ${e.message}</div>`;
        }
    };

    function renderExtensionsList() {
        const container = document.getElementById('extensions-list-container');
        container.innerHTML = '';
        
        if (activeExtensions.length === 0) {
            container.innerHTML = '<div style="color: var(--text-dim); font-size: 0.9rem;">No packages published yet.</div>';
            return;
        }

        // Create structured Table (Mirrors desktop ext_table)
        const table = document.createElement('table');
        table.style.width = '100%';
        table.style.borderCollapse = 'collapse';
        table.style.fontSize = '0.9rem';
        table.style.textAlign = 'left';
        
        table.innerHTML = `
            <thead>
                <tr style="border-bottom: 1.5px solid var(--border-glow); color: var(--text-bright);">
                    <th style="padding: 8px 4px; font-weight: 700;">Filename</th>
                    <th style="padding: 8px 4px; font-weight: 700; width: 60px;">Size</th>
                    <th style="padding: 8px 4px; font-weight: 700; width: 120px;">Status</th>
                </tr>
            </thead>
            <tbody id="extensions-tbody"></tbody>
        `;
        
        container.appendChild(table);
        const tbody = document.getElementById('extensions-tbody');

        activeExtensions.forEach(ext => {
            const tr = document.createElement('tr');
            tr.style.cursor = 'pointer';
            tr.style.borderBottom = '1px solid rgba(255,255,255,0.05)';
            tr.className = `ext-row-item`;
            if (selectedExtension && selectedExtension.filename === ext.filename) {
                tr.style.background = 'rgba(99, 102, 241, 0.15)';
            }
            
            tr.onclick = () => selectExtension(ext);
            
            const statusText = ext.is_visible ? 
                '<span style="color: var(--accent-success); font-weight: 700;"><i class="fa-solid fa-circle-check"></i> Public</span>' : 
                '<span style="color: #f43f5e; font-weight: 700;"><i class="fa-solid fa-eye-slash"></i> Private (Hidden)</span>';
            
            tr.innerHTML = `
                <td style="padding: 10px 4px; color: var(--text-bright); word-break: break-all; max-width: 150px;">${ext.filename}</td>
                <td style="padding: 10px 4px; color: var(--text-dim);">${ext.file_size}</td>
                <td style="padding: 10px 4px;">${statusText}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function selectExtension(ext) {
        selectedExtension = ext;
        renderExtensionsList();
        
        const details = document.getElementById('extension-details-panel');
        
        // Check if current user has admin access
        const savedUserStr = sessionStorage.getItem('quantum_user');
        let isSaaSAdmin = false;
        if (savedUserStr) {
            try {
                const u = JSON.parse(savedUserStr);
                isSaaSAdmin = u.key_type === 'admin_funded' || u.username === 'admin';
            } catch(e){}
        }
        const token = sessionStorage.getItem('quantum_token') || '';

        details.innerHTML = `
            <div style="flex: 1; display: flex; flex-direction: column; gap: 15px; padding: 0 10px 10px 0;">
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-glow); padding-bottom: 10px;">
                    <h3 style="margin: 0; color: var(--text-bright); font-weight: 700; font-size: 1.25rem;">${ext.filename}</h3>
                    <a href="/api/extensions/download/${ext.filename}${token ? '?token=' + token : ''}" target="_blank" class="btn-primary" style="text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; background: #6366f1; border-color: #6366f1; padding: 6px 12px; border-radius: 4px; color: white; font-size: 0.85rem;">
                        <i class="fa-solid fa-download"></i> Download Package
                    </a>
                </div>

                <!-- Admin Action Deck (Pixel-Perfect Desktop UI Mirror) -->
                ${isSaaSAdmin ? `
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label style="display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--text-bright); cursor: pointer; font-size: 0.9rem;">
                            <input type="checkbox" id="admin-visible-chk" ${ext.is_visible ? 'checked' : ''} style="accent-color: #6366f1; transform: scale(1.1);"> Publish to web tenants
                        </label>
                        <button onclick="generateAIDescription()" id="admin-ai-btn" style="background: rgba(99, 102, 241, 0.1); border: 1px solid #6366f1; color: #6366f1; font-weight: 700; font-size: 0.8rem; padding: 5px 10px; border-radius: 4px; cursor: pointer; transition: all 0.2s;">
                            <i class="fa-solid fa-brain"></i> AI Generate
                        </button>
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 700; font-size: 0.85rem; color: var(--text-dim);">Title:</label>
                        <input type="text" id="admin-name-txt" value="${ext.name}" style="background: rgba(0,0,0,0.3); border: 1px solid var(--border-glow); border-radius: 4px; padding: 6px; font-size: 0.9rem; color: white;">
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 700; font-size: 0.85rem; color: var(--text-dim);">Description:</label>
                        <textarea id="admin-desc-txt" style="height: 140px; font-family: monospace; font-size: 0.85rem; padding: 8px; border: 1px solid var(--border-glow); border-radius: 4px; resize: vertical; background: rgba(0,0,0,0.3); color: white;">${ext.description}</textarea>
                    </div>

                    <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 5px;">
                        <button onclick="saveAdminExtensionMeta()" class="btn-primary" style="background: #10b981; border-color: #10b981; font-weight: 700; font-size: 0.85rem; padding: 8px 16px; border-radius: 4px; color: white; cursor: pointer;">
                            <i class="fa-solid fa-floppy-disk"></i> Save Config
                        </button>
                    </div>
                </div>
                ` : `
                <!-- Public Mode (Normal User) -->
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <div style="font-weight: 700; font-size: 1rem; color: var(--text-bright);">${ext.name}</div>
                    <div id="ext-markdown-output" style="color: var(--text-dim); font-family: system-ui, sans-serif; font-size: 0.95rem;">
                        ${marked.parse(ext.description || 'No description available for this version.')}
                    </div>
                </div>
                `}
            </div>
        `;
    }

    window.generateAIDescription = async function() {
        if (!selectedExtension) return;
        const btn = document.getElementById('admin-ai-btn');
        const area = document.getElementById('admin-desc-txt');
        
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Writing...';
        btn.disabled = true;

        try {
            const token = sessionStorage.getItem('quantum_token') || '';
            const res = await fetch('/api/admin/extensions/generate-desc', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    filename: selectedExtension.filename,
                    platform: selectedExtension.platform
                })
            });
            const data = await res.json();
            if (data.success) {
                area.value = data.description;
            } else {
                alert(`AI Draft Failed: ${data.error}`);
            }
        } catch(e) {
            alert(`Network failure: ${e.message}`);
        } finally {
            btn.innerHTML = '<i class="fa-solid fa-brain"></i> AI Generate';
            btn.disabled = false;
        }
    };

    window.saveAdminExtensionMeta = async function() {
        if (!selectedExtension) return;
        
        const isVisible = document.getElementById('admin-visible-chk').checked;
        const name = document.getElementById('admin-name-txt').value;
        const description = document.getElementById('admin-desc-txt').value;

        try {
            const token = sessionStorage.getItem('quantum_token') || '';
            const res = await fetch('/api/admin/extensions/save', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    filename: selectedExtension.filename,
                    is_visible: isVisible,
                    name: name,
                    description: description
                })
            });
            const data = await res.json();
            if (data.success) {
                selectedExtension.is_visible = isVisible;
                selectedExtension.name = name;
                selectedExtension.description = description;
                
                const match = activeExtensions.find(e => e.filename === selectedExtension.filename);
                if (match) {
                    match.is_visible = isVisible;
                    match.name = name;
                    match.description = description;
                }
                
                renderExtensionsList();
                alert("Extension configuration saved successfully!");
            } else {
                alert(`Save Failed: ${data.error}`);
            }
        } catch(e) {
            alert(`Failed to save: ${e.message}`);
        }
    };
</script>
